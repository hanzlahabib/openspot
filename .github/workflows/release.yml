name: Release

# Pushing a tag such as v0.2.0 builds the CLI and GUI for each desktop OS and attaches the
# archives plus SHA256SUMS to a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # macos-latest is Apple silicon.
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p openspot-cli -p openspot-app
      - name: Package
        shell: bash
        env:
          NAME: openspot-${{ github.ref_name }}-${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir "$NAME"
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp "target/$TARGET/release/openspot$ext" "target/$TARGET/release/openspot-gui$ext" "$NAME/"
          cp README.md LICENSE-APACHE LICENSE-MIT "$NAME/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the workspace version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ] && [[ "${GITHUB_REF_NAME}" != "v${version}-"* ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${version}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=""
          # A tag with a hyphen (v1.0.0-rc.1) is a pre-release.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then flags="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes $flags
